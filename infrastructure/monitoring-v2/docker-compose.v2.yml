version: '3.8'

services:
  forgeops-observability-v2-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: forgeops-observability-v2-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - forgeops-observability-v2

  forgeops-observability-v2-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: forgeops-observability-v2-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - forgeops-observability-v2

  forgeops-observability-v2-grafana:
    image: grafana/grafana:10.0.3
    container_name: forgeops-observability-v2-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_DISABLE_CSS_MARKUP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - forgeops-observability-v2-prometheus
    networks:
      - forgeops-observability-v2

networks:
  forgeops-observability-v2:
    driver: bridge
