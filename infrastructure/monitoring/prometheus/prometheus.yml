global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'forgeops-backend'
    metrics_path: '/api/platform/metrics'
    static_configs:
      - targets: ['host.docker.internal:7007', 'localhost:7007']

  - job_name: 'orders-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5001', 'host.docker.internal:5000', 'localhost:5001']

  - job_name: 'payment-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5002', 'localhost:5002']

  - job_name: 'worker-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5003', 'localhost:5003']
