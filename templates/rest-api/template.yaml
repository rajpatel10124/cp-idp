apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-rest-api
  title: Create REST API Service
  description: Scaffolds a production-ready REST API microservice with Docker, Kubernetes manifests, GitHub Actions CI/CD, TechDocs, and Prometheus metrics.
  tags:
    - nodejs
    - express
    - rest-api
    - golden-path
spec:
  owner: team-platform
  type: service

  parameters:
    - title: Service Configuration
      required:
        - component_id
        - description
        - owner
        - port
      properties:
        component_id:
          title: Service Name
          type: string
          description: Unique name of the service (e.g., payment-service, order-api)
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          description: Summary of the REST API's functionality.
        owner:
          title: Owner Team
          type: string
          description: Select team owning this service
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        environment:
          title: Initial Environment
          type: string
          default: dev
          enum:
            - dev
            - staging
            - prod
        port:
          title: HTTP Port
          type: integer
          default: 8080
          description: Port on which the REST API listens.

    - title: Git Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-skeleton
      name: Fetch REST API Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ steps['fetch-skeleton'].output.values.component_id || parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          port: ${{ parameters.port }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish-github
      name: Create GitHub Repository & Push Code
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        access: public

    - id: register-catalog
      name: Register Component in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-github'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps['publish-github'].output.remoteUrl }}
      - title: Backstage Software Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
