name: Service CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-test:
    name: Lint & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Automated Unit Tests
        run: npm test

  docker-build-push:
    name: Build & Push Container Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify AWS OIDC Role Prerequisites
        run: |
          ROLE_ARN="${{ secrets.AWS_OIDC_ROLE_ARN }}"
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN="${{ values.aws_role_arn }}"
          fi
          if [ -z "$ROLE_ARN" ] || [ "$ROLE_ARN" = "NOT_CONFIGURED" ]; then
            echo "::error::AWS OIDC Role ARN is not configured in repository secrets (AWS_OIDC_ROLE_ARN) or Platform Connections."
            echo "::notice::Platform Administrative Setup Required: Configure AWS IAM OIDC Provider & Role ARN in GitHub Repository Secrets or Platform Config."
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || '${{ values.aws_role_arn }}' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ values.component_id }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ values.component_id }}:latest

  deploy-kubernetes:
    name: Deploy Workload to Kubernetes
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || '${{ values.aws_role_arn }}' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name idp-eks-cluster --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/${{ values.component_id }} -n ${{ values.environment }} --timeout=120s
