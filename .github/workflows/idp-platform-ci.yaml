name: IDP Monorepo CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-platform:
    name: Platform Monorepo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.3

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.2'

      - name: Execute System Environment Check
        run: |
          chmod +x scripts/validation/*.sh
          ./scripts/validation/environment-check.sh || true

      - name: Validate Dockerfiles Security
        run: ./scripts/validation/validate-docker.sh

      - name: Validate Terraform Infrastructure Code
        run: |
          chmod +x scripts/validation/validate-terraform.sh
          ./scripts/validation/validate-terraform.sh || true

      - name: Validate Kubernetes Manifests & Helm Charts
        run: |
          chmod +x scripts/validation/validate-kubernetes.sh
          ./scripts/validation/validate-kubernetes.sh || true

      - name: Run Master Platform Validation
        run: |
          chmod +x scripts/validate-all.sh
          ./scripts/validate-all.sh
