
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-ecommerce
  namespace: default
  labels:
    app: mern-ecommerce
    forgeops.io/managed: "true"
    forgeops.io/service-id: "mern-ecommerce"
    forgeops.io/deployment-id: "dep-4710"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mern-ecommerce
  template:
    metadata:
      labels:
        app: mern-ecommerce
        forgeops.io/managed: "true"
        forgeops.io/deployment-id: "dep-4710"
    spec:
      containers:
      - name: mern-ecommerce
        image: undefined
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: mern-ecommerce
  namespace: default
  labels:
    app: mern-ecommerce
    forgeops.io/managed: "true"
    forgeops.io/service-id: "mern-ecommerce"
    forgeops.io/deployment-id: "dep-4710"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: mern-ecommerce
