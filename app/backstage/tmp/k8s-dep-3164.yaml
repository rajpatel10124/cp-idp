
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportivesailers
  namespace: default
  labels:
    app: supportivesailers
    forgeops.io/managed: "true"
    forgeops.io/service-id: "supportivesailers"
    forgeops.io/deployment-id: "dep-3164"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supportivesailers
  template:
    metadata:
      labels:
        app: supportivesailers
        forgeops.io/managed: "true"
        forgeops.io/deployment-id: "dep-3164"
    spec:
      containers:
      - name: supportivesailers
        image: forgeops/supportivesailers:64ecd27
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: supportivesailers
  namespace: default
  labels:
    app: supportivesailers
    forgeops.io/managed: "true"
    forgeops.io/service-id: "supportivesailers"
    forgeops.io/deployment-id: "dep-3164"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: supportivesailers
