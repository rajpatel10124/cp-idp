apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeops
  namespace: forgeops
  labels:
    app.kubernetes.io/name: forgeops
    app.kubernetes.io/part-of: forgeops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: forgeops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgeops
        app.kubernetes.io/part-of: forgeops
    spec:
      serviceAccountName: forgeops
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: forgeops
      containers:
        - name: forgeops
          image: ${FORGEOPS_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - configMapRef:
                name: forgeops-config
            - secretRef:
                name: forgeops-runtime
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
