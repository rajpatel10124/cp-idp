# ==============================================================================
# ForgeOps IDP — Runtime Secret Manifest Template
# DO NOT commit real production passwords or access tokens to git.
# This file serves as a reference template for GitHub Actions / deploy.sh
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: forgeops-runtime
  namespace: forgeops
  labels:
    app.kubernetes.io/name: forgeops
    app.kubernetes.io/part-of: forgeops-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
